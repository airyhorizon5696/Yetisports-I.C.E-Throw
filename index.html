<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Yetisports: I.C.E Throw</title>
  <style>
    :root {
      --ink: #17324d;
      --red: #e5322d;
      --gold: #ffd23f;
      --snow: #f6fcff;
      --ice: #a9d3ec;
      --teal: #2ec4b6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #6ec6f2;
      color: var(--ink);
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Verdana, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none
    }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px;
      pointer-events: none
    }

    #hud>* {
      pointer-events: auto
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 18px;
      box-shadow: 0 4px 0 var(--ink)
    }

    .pill b {
      font-size: 20px
    }

    .coin {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff3a8, #ffc21a 60%, #e39a00);
      border: 3px solid var(--ink);
      display: inline-block;
      flex: none
    }

    .spacer {
      flex: 1
    }

    /* ---------- Boutons ---------- */
    .btn {
      font: inherit;
      font-size: 20px;
      color: #fff;
      background: var(--red);
      border: 4px solid var(--ink);
      border-radius: 14px;
      padding: 10px 20px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--ink);
      text-shadow: 0 2px 0 rgba(0, 0, 0, .25);
      transition: transform .08s, box-shadow .08s
    }

    .btn:hover {
      filter: brightness(1.06)
    }

    .btn:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 var(--ink)
    }

    .btn:focus-visible {
      outline: 4px solid var(--gold);
      outline-offset: 3px
    }

    .btn.alt {
      background: var(--teal)
    }

    .btn.small {
      font-size: 17px;
      padding: 7px 16px;
      box-shadow: 0 4px 0 var(--ink)
    }

    .btn.small:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink)
    }

    .btn:disabled {
      background: #9aa9b8;
      cursor: not-allowed;
      filter: none;
      transform: none;
      box-shadow: 0 6px 0 var(--ink)
    }

    /* ---------- Overlays ---------- */
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      z-index: 5
    }

    .hidden {
      display: none !important
    }

    #result {
      align-items: flex-start;
      padding-top: 9vh;
      pointer-events: none
    }

    .card {
      pointer-events: auto;
      background: #fff;
      border: 5px solid var(--ink);
      border-radius: 22px;
      box-shadow: 0 8px 0 var(--ink);
      padding: 22px 26px;
      width: min(92vw, 420px);
      text-align: center;
      animation: pop .28s cubic-bezier(.2, 1.6, .4, 1)
    }

    @keyframes pop {
      from {
        transform: scale(.7);
        opacity: 0
      }

      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .card .ttl {
      font-size: 22px;
      margin-bottom: 4px
    }

    .card .big {
      font-size: 64px;
      line-height: 1;
      color: var(--red);
      text-shadow: 0 4px 0 var(--ink);
      -webkit-text-stroke: 2px var(--ink);
      margin: 6px 0
    }

    .card .line {
      font-size: 20px;
      margin: 4px 0
    }

    .card .sub {
      font-size: 16px;
      opacity: .75
    }

    .btns {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 18px;
      flex-wrap: wrap
    }

    #shop {
      align-items: center;
      background: rgba(23, 50, 77, .55)
    }

    #shop .card {
      max-height: 92vh;
      overflow: auto;
      text-align: left;
      width: min(94vw, 520px)
    }

    #shop h2 {
      margin: 0 0 4px;
      font-size: 28px
    }

    .shopHead {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-top: 3px dashed var(--ice)
    }

    .row .nm {
      font-size: 19px
    }

    .row .ds {
      font-size: 14px;
      opacity: .7;
      margin: 2px 0 6px
    }

    .pips {
      display: flex;
      gap: 4px;
      flex-wrap: wrap
    }

    .pip {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      border: 3px solid var(--ink);
      background: #fff
    }

    .pip.on {
      background: var(--gold)
    }

    .row .btn {
      min-width: 112px;
      font-size: 17px;
      padding: 8px 12px;
      box-shadow: 0 4px 0 var(--ink)
    }

    .row .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink)
    }

    .row .btn:disabled {
      box-shadow: 0 4px 0 var(--ink)
    }

    @media (prefers-reduced-motion:reduce) {
      .card {
        animation: none
      }
    }
  </style>
</head>

<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="pill"><span class="coin"></span><b id="coins">0</b></div>
    <div class="pill"><span data-i18n="record"></span>&nbsp;<b id="best">0 m</b></div>
    <div class="spacer"></div>
    <button class="btn small" id="setBtn" data-i18n="settings"></button>
    <button class="btn small" id="shopBtn" data-i18n="shop"></button>
  </div>

  <div id="result" class="overlay hidden">
    <div class="card">
      <div class="ttl" id="resTitle"></div>
      <div class="big" id="resDist">0 m</div>
      <div class="line" id="resCoins">+0 pièces</div>
      <div class="line sub" id="resBest"></div>
      <div class="btns">
        <button class="btn" id="replay" data-i18n="replay"></button>
        <button class="btn alt" id="toShop" data-i18n="shop"></button>
      </div>
    </div>
  </div>

  <div id="shop" class="overlay hidden">
    <div class="card">
      <div class="shopHead">
        <h2 data-i18n="shopTitle"></h2>
        <div class="pill"><span class="coin"></span><b id="shopCoins">0</b></div>
      </div>
      <div id="shopList"></div>
      <div class="btns"><button class="btn" id="closeShop" data-i18n="close"></button></div>
    </div>
  </div>

  <div id="settings" class="overlay hidden" style="align-items:center;background:rgba(23,50,77,.55)">
    <div class="card" style="text-align:left;width:min(94vw,520px)">
      <div class="shopHead">
        <h2 data-i18n="settingsTitle"></h2>
      </div>
      <div id="setList"></div>
      <div class="btns"><button class="btn" id="closeSet" data-i18n="close"></button></div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const cv = $('game'), ctx = cv.getContext('2d');

      /* ================= Constantes ================= */
      const PXM = 25;                       // pixels par mètre
      const G = 1300;                       // gravité (px/s²)
      const D2R = Math.PI / 180;
      const YETI_X = 170;                   // position du yéti (pieds)
      const PIVOT = { x: YETI_X + 45, h: 155 };   // épaule du yéti
      const CL = 190;                       // longueur du bras + bâton
      const CONTACT = 116 * D2R;            // angle du bâton à l'impact
      const GD = 620;                       // gravité pendant la chute du bonhomme
      const SWEET = 90;                     // hauteur idéale d'impact (centre du gars)
      const START_X = 372;                  // position de départ du gars
      const R = 28;                         // rayon de collision du gars

      const FUR = '#f4fbff', FURLINE = '#9cc6e3', OUT = '#35618a', FACE = '#9fd8f4', DARK = '#1d2a57';
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const rand = (a, b) => a + Math.random() * (b - a);
      const mod = (v, m) => ((v % m) + m) % m;

      /* ================= Sauvegarde ================= */
      const UPG = [
        { id: 'power', max: 12, base: 40, grow: 1.5 },
        { id: 'aero', max: 8, base: 60, grow: 1.5 },
        { id: 'bounce', max: 8, base: 50, grow: 1.5 },
        { id: 'glide', max: 8, base: 50, grow: 1.5 },
        { id: 'timing', max: 8, base: 70, grow: 1.5 },
      ];
      const mem = {};
      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
      };
      let save = { coins: 0, best: 0, up: {}, lang: 'en', cap: 0, capOn: 1 };
      try { const s = JSON.parse(store.get('yetikick') || 'null'); if (s) save = Object.assign(save, s); } catch (e) { }
      save.up = save.up || {};
      for (const u of UPG) save.up[u.id] = save.up[u.id] | 0;
      const persist = () => store.set('yetikick', JSON.stringify(save));
      save.lang = 'en';

      /* ================= Langues (EN par défaut) ================= */
      const CAP_GOAL = 99999;
      const TX = {

          tNoSwing: 'Missed! The club hit thin air', tNever: 'You had to hit the blond!', tRec: 'New record!', tMeh: 'Meh… the blond got cold', tOk: 'Not bad at all!', tNice: 'Great kick!', tFar: 'Into the stratosphere!',
          coin: 'coin', coins: 'coins', bonus: 'record bonus +25', bestIs: 'Record: ', buy: 'Buy ', max: 'MAX',
          up_power: 'Yeti power', up_power_d: 'A beefier club swing', up_aero: 'Aerodynamics', up_aero_d: 'Less air resistance',
          up_bounce: 'Springy bounces', up_bounce_d: 'Bounces higher on the snow', up_glide: 'Slippery soles', up_glide_d: 'Slides longer on the ice', up_timing: 'Hit zone', up_timing_d: 'More room to hit the blond'
        },
        fr: {
          record: 'Record', shop: 'Boutique', settings: '⚙', replay: 'Rejouer', close: 'Fermer', shopTitle: 'Boutique du yéti', settingsTitle: 'Paramètres',
          language: 'Langue', capName: 'Casquette rouge', capDesc: 'Récolte {0} pièces pour la débloquer', capLocked: 'Verrouillée', on: 'OUI', off: 'NON',
          capNew: 'Casquette rouge débloquée!', tagline: "Envoie-le le plus loin!", hintDrop: 'CLIQUE pour lâcher le blond!', hintHit: 'CLIQUE pour frapper!',
          miss: 'RATÉ!', perfect: 'PARFAIT!', bam: 'BAM!', weak: 'FAIBLE!', pow: 'POW!', bird: 'COUIC!', boing: 'BOING!', crack: 'CRAC!', ouch: 'AÏE!', flouf: 'FLOUF!', recFlag: 'RECORD',
          tNoSwing: 'Raté! Le bâton a frappé dans le vide', tNever: 'Il fallait frapper le blond!', tRec: 'Nouveau record!', tMeh: 'Mouais… le blond a eu froid', tOk: 'Pas mal du tout!', tNice: 'Beau lancer!', tFar: 'Dans la stratosphère!',
          coin: 'pièce', coins: 'pièces', bonus: 'bonus record +25', bestIs: 'Record : ', buy: 'Acheter ', max: 'MAX',
          up_power: 'Puissance du yéti', up_power_d: 'Un coup de bâton plus costaud', up_aero: 'Aérodynamisme', up_aero_d: 'Moins de résistance dans les airs',
          up_bounce: 'Rebonds élastiques', up_bounce_d: 'Rebondit plus haut sur la neige', up_glide: 'Semelles glissantes', up_glide_d: 'Glisse plus longtemps sur la glace', up_timing: 'Zone de frappe', up_timing_d: 'Plus de marge pour toucher le blond'
        }
      };
      const QUIPS = {
        en: ['I have the best words.',
          'That was perfect. Tremendous. Ask anyone.',
          'The snow was rigged. Totally rigged.',
          'I meant to do that. Very smart.',
          'Best crash in history. Many people say so.',

          'My hair is perfect. The wind is cheating.',
          "I'm a very stable genius.",
          'Nobody knows more about trade than me.',
          'I alone can fix it.',
          "I'm, like, a really smart person.",
          'Nobody knew health care could be so complicated.',
          'I know words. I have the best words.',
          'I have the best memory.',
          "I'm the least racist person you've ever met.",
          'We will make America great again.',
          "You're fired!",
          'Fake news!',
          'Sad!',
          'Wrong!',
          'Covfefe.',
          'Nobody builds walls better than me.',
          'My IQ is one of the highest.',
          "I'm a very intelligent person.",
          'I know more about this than anybody.',
          'Many people are saying it.',
          'Believe me.',
          "It's going to be tremendous.",
          "We're going to win so much, you're going to get tired of winning.",
          'The best is yet to come.',
          'I have the best temperament.',
          "I'm not a doctor, but I have a good brain.",
          'The concept of global warming was created by and for the Chinese.',
          "Sharks—I’m not a fan.",
          "We're building a wall in Colorado.",
          'I won the election. By a lot.',
          'Puerto Rico is an island. Surrounded by water. Big water.',
          'Give me a break!',
          'Are you still talking about Jeffrey Epstein?',
          'I’M NOT ON THE EP FILES.'],
        fr: ['I have the best words.',
          'That was perfect. Tremendous. Ask anyone.',
          'The snow was rigged. Totally rigged.',
          'I meant to do that. Very smart.',
          'Best crash in history. Many people say so.',
          'This yeti is a total loser. Sad!',
          'I want to speak to the manager of this mountain.',
          'My hair is perfect. The wind is cheating.',
          "I'm a very stable genius.",
          'Nobody knows more about trade than me.',
          'I alone can fix it.',
          "I'm, like, a really smart person.",
          'Nobody knew health care could be so complicated.',
          'I know words. I have the best words.',
          'I have the best memory.',
          "I'm the least racist person you've ever met.",
          'We will make America great again.',
          "You're fired!",
          'Fake news!',
          'Sad!',
          'Wrong!',
          'Covfefe.',
          'Nobody builds walls better than me.',
          'My IQ is one of the highest.',
          "I'm a very intelligent person.",
          'I know more about this than anybody.',
          'Many people are saying it.',
          'Believe me.',
          "It's going to be tremendous.",
          "We're going to win so much, you're going to get tired of winning.",
          'The best is yet to come.',
          'I have the best temperament.',
          "I'm not a doctor, but I have a good brain.",
          'The concept of global warming was created by and for the Chinese.',
          "Sharks—I’m not a fan.",
          "We're building a wall in Colorado.",
          'I won the election. By a lot.',
          'Puerto Rico is an island. Surrounded by water. Big water.',
          'Give me a break!',
          'Are you still talking about Jeffrey Epstein?',
          'I’M NOT ON THE EP FILES.'],
      };
      const L = (k, a) => { const v = (TX[save.lang] || TX.en)[k]; return a === undefined ? v : v.replace('{0}', a); };
      let quip = null, res = null;
      function sayQuip() { quip = { i: (Math.random() * QUIPS.en.length) | 0, life: 3.4 }; }
      function applyLang() {
        document.documentElement.lang = save.lang;
        document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = L(e.dataset.i18n));
        renderRes();
      }

      const costOf = (u, lvl) => Math.round(u.base * Math.pow(u.grow, lvl) / 5) * 5;

      /* ================= Viewport ================= */
      let W = 800, H = 720, scale = 1, groundY = 590;
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        cv.width = Math.floor(innerWidth * dpr);
        cv.height = Math.floor(innerHeight * dpr);
        scale = Math.min(cv.height / 720, cv.width / 780);
        W = cv.width / scale; H = cv.height / scale;
        groundY = H - 130;
      }
      addEventListener('resize', resize);
      resize();

      /* ================= État du jeu ================= */
      let state = 'ready';                  // ready | swing | flight | result
      let t = 0;
      let swingT = 0, swingFrom = 0, clubAngle = 0, follow = 99;
      let guy, obstacles, particles, popups;
      let camX = 0, camY = 0, shake = 0, flash = 0;
      let nextObsX = 0, stopTimer = 0, resultTimer = -1, bestAtStart = 0, cleanT = 0;
      let yetiMood = 'idle';
      let paused = false, shopOpen = false, resultShown = false;
      let lastQ = 0, connected = false, swung = false, flightT = 0;

      function newRun() {
        guy = { x: START_X, y: groundY - 150, vx: 0, vy: 0, rot: 0, w: 0, mode: 'stand', sq: 0, grounded: false, puffT: 0 };
        obstacles = []; particles = []; popups = [];
        nextObsX = START_X + 800;
        camX = 0; camY = 0; shake = 0; flash = 0;
        state = 'ready';
        clubAngle = 235 * D2R;
        yetiMood = 'idle'; stopTimer = 0; resultTimer = -1; follow = 99; flightT = 0;
        connected = false; swung = false;
        bestAtStart = save.best;
        resultShown = false; quip = null; res = null;
        $('result').classList.add('hidden');
      }

      const zonePx = () => 62 + 7 * save.up.timing;        // marge de frappe (px)
      const perfectPx = () => 14 + 1.5 * save.up.timing;  // marge du coup parfait (px)

      /* ================= Obstacles ================= */
      function makeObs(type, x) {
        const o = { type, x, hit: false, dead: false, hitT: 0, sq: 0, cd: 0 };
        if (type === 'tree') { o.cw = 44; o.ch = 140; }
        if (type === 'rock') { o.cw = 62; o.ch = 44; }
        if (type === 'snowman') { o.cw = 52; o.ch = 116; }
        if (type === 'spring') { o.cw = 120; o.ch = 26; }
        if (type === 'bird') { o.y0 = rand(170, 520); o.y = o.y0; o.amp = rand(25, 60); o.ph = rand(0, 6); o.vx = -rand(40, 110); }
        return o;
      }
      function spawnAhead(limit) {
        while (nextObsX < limit) {
          const m = (nextObsX - START_X) / PXM;
          const r = Math.random();
          let type;
          if (r < 0.14) type = 'spring';
          else if (m > 50 && r < 0.30) type = 'bird';
          else { const k = Math.random(); type = k < 0.45 ? 'tree' : k < 0.75 ? 'rock' : 'snowman'; }
          obstacles.push(makeObs(type, nextObsX));
          nextObsX += rand(380, 820) * (1 - Math.min(0.35, m / 1500));
        }
      }

      /* ================= Particules & textes ================= */
      function burst(x, y, n, kind, cols, spd, size, life, g) {
        if (particles.length > 450) return;
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, s = spd * (0.35 + Math.random() * 0.65);
          particles.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + spd * 0.25,
            life: life * (0.6 + Math.random() * 0.6), max: life, size: size * (0.6 + Math.random() * 0.8),
            col: cols[(Math.random() * cols.length) | 0], kind, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, g
          });
        }
      }
      const puff = (x, y, n, spd) => burst(x, y, n, 'puff', ['#ffffff', '#e3f3fc'], spd, 14, 0.6, 150);
      function popup(text, x, y, col, size) { popups.push({ text, x, y, life: 1.1, max: 1.1, col: col || '#fff', size: size || 44 }); }

      /* ================= Lâcher / Frappe ================= */
      function dropGuy() {
        if (state !== 'ready') return;
        state = 'drop';
        guy.vy = 0; guy.vx = 0; guy.mode = 'fly';
        burst(START_X, guy.y - 62, 12, 'puff', ['#ffffff', '#e3f3fc'], 260, 20, 0.7, 120);
      }
      function startSwing() {
        if (state !== 'drop') return;
        state = 'swing'; swingT = 0; swingFrom = clubAngle; yetiMood = 'yell'; swung = true;
      }
      function fall(dt) {
        const g = guy;
        g.vy -= GD * dt; g.y += g.vy * dt;
        g.rot = Math.sin(t * 7) * 0.2; g.mode = 'fly'; g.grounded = false;
        if (g.y <= R) landMiss();
      }
      function landMiss() {
        const g = guy, impact = Math.max(0, -g.vy);
        g.y = R; g.vy = impact * 0.28; g.vx = 40; g.grounded = false; g.w = 3; g.sq = 0.35; g.mode = 'ground';
        puff(g.x, 4, 10, 260); shake = Math.max(shake, 8);
        sayQuip();
        if (state !== 'miss') popup(L('miss'), g.x + 50, 170, '#9fd8f4', 46);
        state = 'flight'; stopTimer = 0; flightT = 0; yetiMood = 'sad';
      }
      function doHit() {
        const g = guy;
        const dev = g.y - SWEET, ad = Math.abs(dev), zone = zonePx();
        follow = 0; flightT = 0; stopTimer = 0;
        if (ad > zone) {                       // le bâton frappe dans le vide
          state = 'miss'; yetiMood = 'sad';
          popup(L('miss'), g.x + 50, Math.max(g.y + 40, 170), '#9fd8f4', 46);
          return;
        }
        connected = true;
        const perfect = ad <= perfectPx();
        let q = perfect ? 1 : 1 - 0.8 * Math.pow(ad / zone, 1.3);
        lastQ = q;
        const ang = clamp(46 + (dev / zone) * 24, 14, 78) * D2R;   // trop tôt = plus haut, trop tard = plus bas

        shake = 12 + q * 10; flash = 0.2;

        puff(hx, hy, 10, 360);
        const py = Math.max(hy + 90, 190);

        else if (q > 0.72) popup(L('bam'), hx + 60, py, '#ff6b4a', 54);

      /* ================= Fin de partie ================= */

        $('resBest').textContent = L('bestIs') + save.best + ' m';
      }
      function finish() {
        if (state !== 'flight') return;
        state = 'result'; guy.mode = 'ko'; guy.vx = 0; guy.vy = 0;
        const d = Math.max(0, Math.floor((guy.x - START_X) / PXM));
        const rec = d > save.best;
        const earned = d + (rec ? 25 : 0);
        save.coins += earned;
        if (rec) save.best = d;
        persist();
        yetiMood = rec ? 'win' : d < 35 ? 'sad' : 'happy';
        let tk;
        if (!connected) tk = swung ? 'tNoSwing' : 'tNever';
        else if (rec) tk = 'tRec';
        else if (d < 35) tk = 'tMeh';
        else if (d < 100) tk = 'tOk';
        else if (d < 250) tk = 'tNice';
        else tk = 'tFar';
        const newCap = !save.cap && save.coins >= CAP_GOAL;
        if (newCap) { save.cap = 1; persist(); }
        res = { tk, d, earned, rec, newCap };
        renderRes();
        if (connected) sayQuip();
        resultTimer = 0.9;

      /* ================= Physique ================= */
      function physics(dt) {
        const g = guy;
        if (!g.grounded) {
          const drag = 0.04 * (1 - 0.09 * save.up.aero);
          g.vx -= g.vx * drag * dt; g.vy -= g.vy * drag * dt;
          g.vy -= G * dt;
          g.rot += g.w * dt;
        }
        g.x += g.vx * dt; g.y += g.vy * dt;

        if (g.grounded) {
          g.y = R; g.vy = 0;
          const fr = Math.max(110, 520 - 48 * save.up.glide);
          g.vx = Math.max(0, g.vx - (fr + 0.22 * Math.abs(g.vx)) * dt);
          g.rot += (g.vx / R) * 0.55 * dt;
          g.puffT -= dt;
          if (g.puffT <= 0 && g.vx > 140) { g.puffT = 0.05; burst(g.x - 20, 6, 2, 'puff', ['#ffffff', '#e3f3fc'], 120, 10, 0.5, 100); }

            g.vx *= Math.min(0.97, 0.88 + 0.012 * save.up.bounce);
            g.w *= 0.8; g.sq = 0.35;

            shake = Math.max(shake, Math.min(11, impact * 0.006));
          } else { g.vy = 0; g.grounded = true; }
        }
        g.mode = g.grounded ? 'ground' : 'fly';

        /* collisions avec les obstacles */
        for (const o of obstacles) {
          if (o.dead || Math.abs(o.x - g.x) > 260) continue;
          if (o.type === 'bird') {
            if (Math.hypot(g.x - o.x, g.y - o.y) < R + 26) {
              o.dead = true;
              g.vx *= 0.78; g.vy = g.vy * 0.5 - 80;
              burst(o.x, o.y, 10, 'feather', ['#4ab3f4', '#bfe7ff'], 300, 9, 0.9, 120);
              popup(L('bird'), o.x, o.y + 40, '#4ab3f4', 40); shake = Math.max(shake, 6);
            }
            continue;
          }
          if (o.type === 'spring') {
            const inX = g.x > o.x - o.cw / 2 - 14 && g.x < o.x + o.cw / 2 + 14;
            if (inX && o.cd <= 0 && (g.vy <= 0 || g.grounded) && g.y - R <= o.ch + 8 && g.vx > 120) {
              g.grounded = false;
              g.vy = Math.max(950, Math.abs(g.vy) * 1.3 + 500);
              g.vx *= 1.12; g.w = 9; g.y = R + o.ch;
              o.sq = 1; o.cd = 0.5;
              popup(L('boing'), o.x, 150, '#ffd23f', 46); burst(o.x, o.ch, 8, 'star', ['#ffd23f', '#ff6b4a'], 380, 10, 0.5, 300);
            }
            continue;
          }
          if (o.hit) continue;
          const cx = clamp(g.x, o.x - o.cw / 2, o.x + o.cw / 2), cy = clamp(g.y, 0, o.ch);
          if (Math.hypot(g.x - cx, g.y - cy) >= R) continue;
          o.hit = true; o.hitT = t;
          if (o.type === 'tree') {
            g.vx *= 0.62;
            if (g.grounded) { g.grounded = false; g.vy = 320; } else g.vy *= 0.7;
            burst(o.x, o.ch * 0.6, 14, 'rect', ['#2f8f5b', '#4fb37a', '#ffffff'], 380, 9, 0.9, 500);
            popup(L('crack'), o.x, o.ch + 50, '#4fb37a', 44); shake = Math.max(shake, 9);
          } else if (o.type === 'rock') {
            g.vx *= 0.5; g.grounded = false; g.vy = Math.max(g.vy, 480); g.w += 6;
            burst(o.x, o.ch, 8, 'puff', ['#ffffff', '#c9d4e0'], 280, 10, 0.6, 300);
            popup(L('ouch'), o.x, o.ch + 70, '#c9d4e0', 44); shake = Math.max(shake, 8);
          } else if (o.type === 'snowman') {
            o.dead = true; g.vx *= 0.84; g.vy *= 0.9;
            burst(o.x, o.ch * 0.5, 9, 'ball', ['#ffffff', '#e3f3fc'], 460, 14, 1.3, 900);
            burst(o.x, o.ch * 0.9, 1, 'rect', ['#ff8a1f'], 300, 11, 1.2, 900);
            popup(L('flouf'), o.x, o.ch + 50, '#ffffff', 44); shake = Math.max(shake, 6);

      }

      /* ================= Mise à jour ================= */
      let acc = 0;
      function update(dt) {
        if (paused) return;
        t += dt;
        const g = guy;

        if (state === 'ready') {
          g.y = groundY - 150 + Math.sin(t * 2) * 3; g.vy = 0; g.mode = 'stand';
          clubAngle = (235 + Math.sin(t * 2.2) * 3) * D2R;
        } else if (state === 'drop' || state === 'swing' || state === 'miss') {
          fall(dt);
          if (state === 'drop') clubAngle = (235 + Math.sin(t * 2.2) * 3) * D2R;
          else if (state === 'swing') {
            swingT += dt;
            if (swingT < 0.05) clubAngle = lerp(swingFrom, 255 * D2R, swingT / 0.05);
            else {
              const k = Math.min(1, (swingT - 0.05) / 0.09);
              clubAngle = lerp(255 * D2R, CONTACT, k * k);
              if (k >= 1) doHit();
            }
          }
        }
        if (state === 'flight' || state === 'result' || state === 'miss') {
          follow += dt;
          if (follow < 0.3) clubAngle = lerp(CONTACT, 15 * D2R, 1 - Math.pow(1 - follow / 0.3, 2));
          else clubAngle = lerp(clubAngle, 40 * D2R, 1 - Math.exp(-dt * 3));
        }
        if (state === 'flight') {
          if (follow > 0.55 && yetiMood === 'yell') yetiMood = 'idle';
          flightT += dt;
          acc += dt;
          let n = 0;
          while (acc >= 1 / 120 && n < 12) { physics(1 / 120); acc -= 1 / 120; n++; }
          if (n >= 12) acc = 0;
          if (flightT > 60) finish();
        }

        // Caméra
        const tx = (state === 'flight' || state === 'result') ? Math.max(0, g.x - W * 0.30) : 0;
        camX += (tx - camX) * Math.min(1, dt * (state === 'flight' ? 12 : 3));
        camX = Math.max(camX, g.x - W * 0.7);
        const ty = Math.max(0, g.y + 140 - groundY);
        camY += (ty - camY) * Math.min(1, dt * 9);
        camY = Math.max(camY, g.y + 95 - groundY);   // le gars ne sort jamais par le haut de l'écran

        // Obstacles
        spawnAhead(camX + W + 700);
        for (const o of obstacles) {
          if (o.cd > 0) o.cd -= dt;
          if (o.sq > 0) o.sq = Math.max(0, o.sq - dt * 3);
          if (o.type === 'bird' && !o.dead) { o.x += o.vx * dt; o.y = o.y0 + Math.sin(t * 2 + o.ph) * o.amp; }
        }
        cleanT += dt;
        if (cleanT > 0.5) { cleanT = 0; obstacles = obstacles.filter(o => o.x > camX - 500 && !(o.dead && o.type !== 'bird')); }

        // Particules, textes, effets
        for (const p of particles) {
          p.vy -= p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
          if (p.kind === 'ball') { if (p.y < p.size) { p.y = p.size; p.vy = Math.abs(p.vy) * 0.4; p.vx *= 0.7; } }
          else if (p.y < 0) { p.y = 0; p.vy = 0; p.vx *= 0.8; }
        }
        particles = particles.filter(p => p.life > 0);
        for (const p of popups) { p.life -= dt; p.y += 50 * dt; }
        popups = popups.filter(p => p.life > 0);
        shake = Math.max(0, shake - dt * 40);
        flash = Math.max(0, flash - dt);
        if (quip) quip.life -= dt;
        guy.sq = Math.max(0, guy.sq - dt * 2.2);

        if (state === 'result') {
          // le gars se couche à plat
          const target = Math.round((guy.rot - Math.PI / 2) / Math.PI) * Math.PI + Math.PI / 2;
          guy.rot += (target - guy.rot) * Math.min(1, dt * 6);
          if (resultTimer > 0) { resultTimer -= dt; if (resultTimer <= 0) { $('result').classList.remove('hidden'); resultShown = true; } }
        }
      }

      let last = performance.now();
      function frame(now) {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
        update(dt);
        render();
        requestAnimationFrame(frame);
      }
      newRun(); updHud(); applyLang();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
